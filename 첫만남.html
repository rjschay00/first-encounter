<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<style>
:root{--head:#3fbcc8;--mine:#5cc1cc;--theirs:#f3f3f3;--text:#111;--bg:#fff;--line:#e3e3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--text);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{background:var(--head);height:56px;display:flex;align-items:center;color:#fff;flex:none}
header .back{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer}
header h1{font-size:20px;font-weight:500;margin:0 0 0 4px}
#log{flex:1;overflow-y:auto;padding:22px 14px 12px}
.row{display:flex;margin-bottom:12px;align-items:flex-start}
.row.me{justify-content:flex-end}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;margin-right:12px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.ph{visibility:hidden}
.col{display:flex;flex-direction:column;align-items:flex-start;max-width:70%}
.name{font-size:15px;margin:0 0 4px 2px}
.bubble{background:var(--theirs);border-radius:10px;padding:14px;font-size:17px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;position:relative;margin-bottom:12px}
.col .bubble:last-child{margin-bottom:0}
.first .bubble:first-of-type::before{content:"";position:absolute;left:-9px;top:20px;border:6px solid transparent;border-right:9px solid var(--theirs);border-left:0}
.me .bubble{background:var(--mine);color:#fff;margin:0;padding:12px 14px;max-width:70%;border-radius:12px;border-top-right-radius:4px}
.me .bubble::after{content:"";position:absolute;right:-8px;top:10px;border:6px solid transparent;border-left:9px solid var(--mine);border-right:0}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#999;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
form{display:flex;gap:10px;padding:10px 8px calc(28px + env(safe-area-inset-bottom,0px));flex:none;background:var(--bg)}
input{flex:1;min-width:0;height:48px;border:2px solid var(--line);border-radius:6px;padding:0 12px;font-size:17px;background:#fff;color:var(--text);font-family:inherit;outline:none}
input:focus{border-color:var(--head)}
button.send{width:86px;height:48px;border:0;border-radius:6px;background:var(--head);color:#fff;font-size:17px;font-family:inherit;cursor:pointer}
button.send:active{filter:brightness(.92)}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:5}
#modal.off{display:none}
.card{background:#fff;border-radius:12px;width:82%;padding:24px 20px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card h2{margin:0 0 16px;font-size:18px;font-weight:500;text-align:center}
.card input{width:100%;box-sizing:border-box;text-align:center}
.card button{margin-top:16px;width:100%;height:46px;border:0;border-radius:6px;background:var(--head);color:#fff;font-size:17px;font-family:inherit;cursor:pointer}
.card button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" aria-label="뒤로" type="button">
      <svg width="26" height="40" viewBox="0 0 26 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 6 20l14 16"/></svg>
    </button>
    <h1 id="title"></h1>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <input id="inp" type="text" aria-label="메시지 입력" readonly>
    <button class="send" type="submit">전송</button>
  </form>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <form class="card" id="nf" autocomplete="off" style="display:block;background:#fff;padding:24px 20px 20px">
      <h2 id="mt">당신의 이름을 입력해주세요</h2>
      <input id="nm" type="text" maxlength="10" aria-label="이름">
      <button type="submit" id="nb" disabled>확인</button>
    </form>
  </div>
</div>

const log=document.getElementById('log'),f=document.getElementById('f'),inp=document.getElementById('inp');
const modal=document.getElementById('modal'),nm=document.getElementById('nm'),nb=document.getElementById('nb');
let PLAYER='',lastSender=null,locked=true,queue=Promise.resolve();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scroll=()=>{log.scrollTop=log.scrollHeight};

function addMine(t){
  const r=document.createElement('div');r.className='row me';
  const b=document.createElement('div');b.className='bubble';b.textContent=t;
  r.appendChild(b);log.appendChild(r);lastSender='me';scroll();
}
function startTheirs(){
  const r=document.createElement('div');r.className='row';
  const first=lastSender!=='them';
  const a=document.createElement('div');a.className='avatar'+(first?'':' ph');
  const im=document.createElement('img');im.src=AV;im.alt='';a.appendChild(im);
  const c=document.createElement('div');c.className='col'+(first?' first':'');
  if(first){const n=document.createElement('div');n.className='name';n.textContent=PLAYER;c.appendChild(n);}
  r.append(a,c);log.appendChild(r);lastSender='them';return c;
}
async function theirs(lines){
  let col=null;
  for(const t of lines){
    col=col||startTheirs();
    const b=document.createElement('div');b.className='bubble typing';
    b.innerHTML='<span></span><span></span><span></span>';col.appendChild(b);scroll();
    await sleep(500+Math.min(t.length,30)*45);
    b.classList.remove('typing');b.textContent=t;scroll();
    await sleep(250);
  }
}
async function typeAndSend(t){
  inp.readOnly=true;
  await sleep(500);
  for(const ch of t){inp.value+=ch;inp.scrollLeft=inp.scrollWidth;await sleep(40+Math.random()*45);}
  await sleep(400);
  inp.value='';addMine(t);
}

      const lines=[];

  await sleep(3000);
  const off=document.createElement('div');
  off.style.cssText='position:fixed;inset:0;background:#000;opacity:0;transition:opacity .6s ease;z-index:99';
  document.body.appendChild(off);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{off.style.opacity='1'}));
}

const fallback=[['네…?'],['그, 그게… 잘 모르겠어요.'],['아… 네, 알겠어요.'],['죄송해요, 방금 뭐라고 하셨죠?']];
let fi=0;
f.addEventListener('submit',e=>{
  e.preventDefault();
  if(locked)return;
  const t=inp.value.trim();if(!t)return;
  inp.value='';addMine(t);
  queue=queue.then(async()=>{await sleep(700);await theirs(fallback[fi++%fallback.length]);});
});

nm.addEventListener('input',()=>{nb.disabled=!nm.value.trim()});
document.getElementById('nf').addEventListener('submit',e=>{
  e.preventDefault();
  const v=nm.value.trim();if(!v)return;
  PLAYER=v;document.getElementById('title').textContent=v;
  modal.classList.add('off');run();
});
setTimeout(()=>nm.focus({preventScroll:true}),100);
</script>
